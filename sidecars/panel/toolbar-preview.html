<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Antigrative Dashboard · 模型同一行预览</title>
<style>body{margin:0;padding:70px 22px;background:#111;color:#aaa;font:12px "Segoe UI","Microsoft YaHei",sans-serif}.rounded-composer{max-width:790px;margin:auto;background:#202020;border:1px solid #303030;border-radius:19px;padding:9px}.editor{padding:6px 2px;height:48px;outline:none;font-size:14px}.actions{display:flex;align-items:center;justify-content:space-between;gap:5px;height:30px}.left{display:flex;align-items:center;flex:1;white-space:nowrap}.right{display:flex;align-items:center;gap:8px;flex-shrink:0}button{font:inherit;color:#bbb;background:none;border:0;cursor:pointer;height:28px}.send{border-radius:50%;background:#303030;width:30px}.project{max-width:780px;margin:0 auto 18px;color:#707984}</style></head>
<body><div class="project">Agent</div><div class="rounded-composer"><div class="editor" contenteditable="true" aria-label="Message input">Ask anything, @ to mention, / for actions</div><div class="actions"><div class="left"><button aria-label="Add context">＋</button><button data-testid="model-selector-trigger" aria-label="Select model, current: Gemini 3.8 Flash High">Gemini 3.8 Flash High⌄</button></div><div class="right"><button aria-label="Record voice memo">♩</button><button class="send" aria-label="Send message">➜</button></div></div></div>
<script type="module">
window.agPulseHost={getMetrics:async(input)=>{const p=new URLSearchParams();if(input.conversationId)p.set('conversationId',input.conversationId);if(input.force)p.set('force','1');return (await fetch('/api/metrics?'+p)).json();},report:()=>{}};
const data=await window.agPulseHost.getMetrics({});
if(!location.search.includes('new')&&data.speed?.conversationId)history.replaceState({},'', '/toolbar-preview/c/'+data.speed.conversationId);
const script=document.createElement('script');script.src='/inline-widget.js';document.head.append(script);
</script></body></html>
